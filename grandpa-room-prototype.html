<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cypherpunk Legacy - Grandpa's Cabin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #b0b0b0;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 5px;
        }
        #interaction-prompt {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(20, 20, 20, 0.95);
            border: 2px solid #5a7a8a;
            padding: 15px 35px;
            border-radius: 5px;
            display: none;
            animation: pulse 1.5s infinite;
            color: #b0b0b0;
            font-size: 18px;
        }
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
            z-index: 50;
        }
        #transition-overlay.active {
            opacity: 1;
        }
        #game-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #7a7a7a;
            font-size: 13px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
        }

        /* Cryptopolis Menu Buttons */
        .menu-button {
            background: linear-gradient(to bottom, #2a3a4a 0%, #1a2a3a 100%);
            border: 2px solid #5a7a8a;
            color: #b0b0b0;
            padding: 20px 50px;
            font-size: 24px;
            margin: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .menu-button:hover {
            background: linear-gradient(to bottom, #3a4a5a 0%, #2a3a4a 100%);
            border-color: #7a9aaa;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
        .menu-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="ui-overlay">
            <div><strong>Scene:</strong> <span id="scene-name">Grandpa's Cabin</span></div>
            <div style="margin-top: 5px; font-size: 14px;">WASD or Arrow keys to move</div>
        </div>

        <div id="interaction-prompt">
            Press E to access computer
        </div>

        <div id="transition-overlay"></div>

        <div id="game-info">
            Cypherpunk Legacy - Pixel Art Adventure
        </div>
    </div>

    <script>
        // ==================== Canvas Setup ====================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==================== Game State ====================
        const GameState = {
            GRANDPA_CABIN: 'grandpa_cabin',
            CRYPTOPOLIS_MENU: 'cryptopolis_menu',
            GAME_WORLD: 'game_world'
        };

        let currentState = GameState.GRANDPA_CABIN;
        let gameStarted = false;

        // ==================== Pixel Art Settings ====================
        const PIXEL = 6; // Pixel block size
        const CHAR_SIZE = 20; // Character size in pixels

        // ==================== Player Character ====================
        const player = {
            x: window.innerWidth / 2,
            y: window.innerHeight - 200,
            width: CHAR_SIZE * PIXEL,
            height: CHAR_SIZE * PIXEL,
            speed: 4,
            direction: 'down',
            animFrame: 0,
            animTimer: 0,
            isMoving: false
        };

        // ==================== Old CRT Computer ====================
        const computer = {
            x: 0,
            y: 0,
            width: 0,
            height: 0,
            interactRadius: 100
        };

        function updateComputerPosition() {
            computer.width = 28 * PIXEL;
            computer.height = 26 * PIXEL;
            computer.x = (canvas.width - computer.width) / 2;
            computer.y = canvas.height / 2 - 200;
        }
        updateComputerPosition();

        // Collision boxes for furniture
        let collisionRects = [];

        function updateCollisionRects() {
            const w = canvas.width;
            const h = canvas.height;

            collisionRects = [
                // Bookshelf left
                { x: 50, y: h/2 - 100, width: 120, height: 180 },
                // Bed right
                { x: w - 250, y: h/2 - 80, width: 200, height: 150 },
                // Desk (computer area) - player can't walk through
                { x: computer.x - 20, y: computer.y + computer.height - 40, width: computer.width + 40, height: 100 },
                // Top wall area
                { x: 0, y: 0, width: w, height: 100 }
            ];
        }
        updateCollisionRects();

        // ==================== Keyboard Input ====================
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'e' || e.key === 'E') {
                checkInteraction();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // ==================== Draw Character Sprites ====================
        function drawPlayer() {
            const px = Math.floor(player.x - player.width/2);
            const py = Math.floor(player.y - player.height/2);
            const p = PIXEL;

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(px + p*5, py + p*18, p*10, p*2);

            const walk = player.isMoving && player.animFrame === 1 ? p : 0;

            if (player.direction === 'down') {
                drawCharacterDown(px, py, walk);
            } else if (player.direction === 'up') {
                drawCharacterUp(px, py, walk);
            } else if (player.direction === 'left') {
                drawCharacterLeft(px, py, walk);
            } else if (player.direction === 'right') {
                drawCharacterRight(px, py, walk);
            }
        }

        function drawCharacterDown(px, py, walk) {
            const p = PIXEL;
            // Hair
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(px + p*6, py + p*3, p*8, p*4);
            // Head
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*7, py + p*5, p*6, p*5);
            // Eyes
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(px + p*8, py + p*7, p*1, p*1);
            ctx.fillRect(px + p*11, py + p*7, p*1, p*1);
            // Body
            ctx.fillStyle = '#5a6a7a';
            ctx.fillRect(px + p*6, py + p*10, p*8, p*6);
            // Arms
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*4, py + p*11, p*2, p*5);
            ctx.fillRect(px + p*14, py + p*11, p*2, p*5);
            // Legs
            ctx.fillStyle = '#3a4a5a';
            ctx.fillRect(px + p*7, py + p*16 - walk, p*2, p*4 + walk);
            ctx.fillRect(px + p*11, py + p*16 + walk, p*2, p*4 - walk);
        }

        function drawCharacterUp(px, py, walk) {
            const p = PIXEL;
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(px + p*6, py + p*3, p*8, p*5);
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*7, py + p*5, p*6, p*5);
            ctx.fillStyle = '#5a6a7a';
            ctx.fillRect(px + p*6, py + p*10, p*8, p*6);
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*4, py + p*11, p*2, p*5);
            ctx.fillRect(px + p*14, py + p*11, p*2, p*5);
            ctx.fillStyle = '#3a4a5a';
            ctx.fillRect(px + p*7, py + p*16 - walk, p*2, p*4 + walk);
            ctx.fillRect(px + p*11, py + p*16 + walk, p*2, p*4 - walk);
        }

        function drawCharacterLeft(px, py, walk) {
            const p = PIXEL;
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(px + p*5, py + p*3, p*8, p*4);
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*6, py + p*5, p*6, p*5);
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(px + p*7, py + p*7, p*1, p*1);
            ctx.fillStyle = '#5a6a7a';
            ctx.fillRect(px + p*6, py + p*10, p*7, p*6);
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*4, py + p*11, p*2, p*4);
            ctx.fillStyle = '#3a4a5a';
            ctx.fillRect(px + p*7, py + p*16 - walk, p*2, p*4 + walk);
            ctx.fillRect(px + p*10, py + p*16 + walk, p*2, p*4 - walk);
        }

        function drawCharacterRight(px, py, walk) {
            const p = PIXEL;
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(px + p*7, py + p*3, p*8, p*4);
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*8, py + p*5, p*6, p*5);
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(px + p*12, py + p*7, p*1, p*1);
            ctx.fillStyle = '#5a6a7a';
            ctx.fillRect(px + p*7, py + p*10, p*7, p*6);
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(px + p*14, py + p*11, p*2, p*4);
            ctx.fillStyle = '#3a4a5a';
            ctx.fillRect(px + p*8, py + p*16 - walk, p*2, p*4 + walk);
            ctx.fillRect(px + p*11, py + p*16 + walk, p*2, p*4 - walk);
        }

        // ==================== Draw Wooden Cabin ====================
        function drawGrandpaCabin() {
            const w = canvas.width;
            const h = canvas.height;

            // Wooden floor
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(0, 0, w, h);

            // Floor planks
            ctx.strokeStyle = '#4a3a2a';
            ctx.lineWidth = 3;
            for (let y = 0; y < h; y += PIXEL * 8) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }

            // Wooden walls
            ctx.fillStyle = '#6a5a4a';
            ctx.fillRect(0, 0, w, 100);
            ctx.fillRect(0, 0, 80, h);
            ctx.fillRect(w - 80, 0, 80, h);

            // Wall planks
            ctx.strokeStyle = '#5a4a3a';
            ctx.lineWidth = 2;
            for (let x = 0; x < w; x += PIXEL * 6) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 100);
                ctx.stroke();
            }

            // Window
            drawWindow(w - 200, 20);

            // Bookshelf
            drawBookshelf(50, h/2 - 100);

            // Bed
            drawBed(w - 250, h/2 - 80);

            // Rug under desk
            drawRug(computer.x - 60, computer.y + computer.height - 20, computer.width + 120, 140);

            // Desk
            drawDesk();

            // Old CRT Computer
            drawCRTComputer();
        }

        function drawWindow(x, y) {
            const size = PIXEL * 12;
            // Frame
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(x - 4, y - 4, size + 8, size + 8);
            // Glass
            const gradient = ctx.createLinearGradient(x, y, x, y + size);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#B0E0E6');
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, size, size);
            // Cross
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(x + size/2 - 2, y, 4, size);
            ctx.fillRect(x, y + size/2 - 2, size, 4);
        }

        function drawBookshelf(x, y) {
            const w = 120;
            const h = 180;
            // Shelf body
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(x, y, w, h);
            // Shelves
            ctx.fillStyle = '#6a5a4a';
            for (let i = 0; i <= 4; i++) {
                ctx.fillRect(x, y + i * (h/4), w, 4);
            }
            // Books
            const bookColors = ['#8a5a4a', '#5a7a6a', '#7a6a8a', '#6a5a7a'];
            for (let shelf = 0; shelf < 4; shelf++) {
                for (let book = 0; book < 8; book++) {
                    ctx.fillStyle = bookColors[(shelf + book) % 4];
                    ctx.fillRect(x + 8 + book * 13, y + 8 + shelf * (h/4), 11, h/4 - 12);
                }
            }
        }

        function drawBed(x, y) {
            const w = 200;
            const h = 150;
            // Bed frame
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(x, y + h - 30, w, 30);
            // Mattress
            ctx.fillStyle = '#7a6a5a';
            ctx.fillRect(x + 10, y + 30, w - 20, h - 30);
            // Pillow
            ctx.fillStyle = '#9a8a7a';
            ctx.fillRect(x + 20, y + 40, 60, 30);
            // Blanket
            ctx.fillStyle = '#6a5a4a';
            ctx.fillRect(x + 30, y + 80, w - 60, 50);
        }

        function drawRug(x, y, w, h) {
            // Rug
            ctx.fillStyle = '#7a4a3a';
            ctx.fillRect(x, y, w, h);
            // Border
            ctx.strokeStyle = '#5a3a2a';
            ctx.lineWidth = 6;
            ctx.strokeRect(x + 8, y + 8, w - 16, h - 16);
        }

        function drawDesk() {
            const x = computer.x - 20;
            const y = computer.y + computer.height - 40;
            const w = computer.width + 40;
            const h = 100;

            // Desktop
            ctx.fillStyle = '#6a5a4a';
            ctx.fillRect(x, y, w, 12);

            // Desktop highlight
            ctx.fillStyle = '#7a6a5a';
            ctx.fillRect(x + 4, y + 2, w - 8, 4);

            // Legs
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(x + 10, y + 12, 10, h - 12);
            ctx.fillRect(x + w - 20, y + 12, 10, h - 12);
        }

        function drawCRTComputer() {
            const cx = computer.x;
            const cy = computer.y;
            const p = PIXEL;

            // Big CRT Monitor (old style with depth)
            // Monitor back/depth
            ctx.fillStyle = '#4a4a4a';
            ctx.fillRect(cx, cy, computer.width, computer.height * 0.75);

            // Monitor bezel
            ctx.fillStyle = '#5a5a5a';
            ctx.fillRect(cx + p*2, cy + p*2, computer.width - p*4, computer.height * 0.75 - p*4);

            // Screen (deep inside)
            const isNear = isNearComputer();
            ctx.fillStyle = isNear ? '#2a4a5a' : '#1a1a1a';
            ctx.fillRect(cx + p*3, cy + p*3, computer.width - p*6, computer.height * 0.75 - p*6);

            // Screen glow
            if (isNear) {
                const time = Date.now() / 1000;
                const pulse = Math.sin(time * 2) * 0.3 + 0.7;
                ctx.globalAlpha = pulse * 0.4;
                ctx.fillStyle = '#4a6a8a';
                ctx.fillRect(cx + p*3, cy + p*3, computer.width - p*6, computer.height * 0.75 - p*6);
                ctx.globalAlpha = 1;

                // Scanlines
                for (let i = 0; i < 8; i++) {
                    ctx.fillStyle = 'rgba(100, 150, 180, 0.2)';
                    ctx.fillRect(cx + p*3, cy + p*3 + i * p*2, computer.width - p*6, p*0.5);
                }

                // Old terminal text
                ctx.fillStyle = '#5a8aaa';
                ctx.font = `${p*2}px monospace`;
                ctx.fillText('READY.', cx + p*5, cy + p*7);
            }

            // Bottom bezel with brand
            ctx.fillStyle = '#6a6a6a';
            ctx.fillRect(cx + p*3, cy + computer.height * 0.75 - p*5, computer.width - p*6, p*3);

            // Power LED
            if (isNear) {
                ctx.fillStyle = '#4aaa4a';
                ctx.fillRect(cx + p*4, cy + computer.height * 0.75 - p*3.5, p*1.5, p*1.5);
            }

            // Monitor base (old style thick base)
            ctx.fillStyle = '#3a3a3a';
            const baseW = computer.width * 0.6;
            const baseX = cx + (computer.width - baseW) / 2;
            ctx.fillRect(baseX, cy + computer.height * 0.75, baseW, p*4);

            // Keyboard
            ctx.fillStyle = '#4a4a3a';
            ctx.fillRect(cx - p*2, cy + computer.height * 0.75 + p*6, computer.width + p*4, p*3);
            // Keys
            ctx.fillStyle = '#3a3a2a';
            for (let i = 0; i < 12; i++) {
                for (let j = 0; j < 3; j++) {
                    ctx.fillRect(cx + p*(i*2), cy + computer.height * 0.75 + p*7 + j*p, p*1.5, p*0.8);
                }
            }
        }

        // ==================== Draw Cryptopolis Menu ====================
        function drawCryptopolisMenu() {
            const w = canvas.width;
            const h = canvas.height;

            // Cyberpunk sky
            const gradient = ctx.createLinearGradient(0, 0, 0, h);
            gradient.addColorStop(0, '#0a1a2a');
            gradient.addColorStop(1, '#1a2a3a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);

            // Stars
            ctx.fillStyle = '#5a6a7a';
            for (let i = 0; i < 100; i++) {
                const x = (i * 1237) % w;
                const y = (i * 4567) % (h * 0.6);
                const size = (i % 3) + 2;
                ctx.fillRect(x, y, size, size);
            }

            // City skyline
            const buildingCount = Math.floor(w / 150);
            for (let i = 0; i < buildingCount; i++) {
                const bx = i * (w / buildingCount);
                const bw = w / buildingCount - 20;
                const bh = 200 + (i % 3) * 100;
                const by = h - bh - 80;

                ctx.fillStyle = i % 2 === 0 ? '#2a3a4a' : '#1a2a3a';
                ctx.fillRect(bx, by, bw, bh);

                // Windows
                ctx.fillStyle = '#4a5a6a';
                for (let row = 0; row < Math.floor(bh / 30); row++) {
                    for (let col = 0; col < Math.floor(bw / 25); col++) {
                        if (Math.random() > 0.4) {
                            ctx.fillRect(bx + 8 + col * 25, by + 15 + row * 30, 12, 18);
                        }
                    }
                }
            }

            // Ground
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, h - 80, w, 80);

            // Grid
            ctx.strokeStyle = '#2a2a3a';
            ctx.lineWidth = 2;
            for (let x = 0; x < w; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, h - 80);
                ctx.lineTo(x, h);
                ctx.stroke();
            }

            // Title
            ctx.fillStyle = '#5a7a8a';
            ctx.font = 'bold 64px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('CRYPTOPOLIS', w / 2, h / 4);

            ctx.fillStyle = '#4a6a7a';
            ctx.font = '20px "Courier New"';
            ctx.fillText('The Digital Cypherpunk World', w / 2, h / 4 + 40);

            // Menu buttons
            drawMenuButtons();
        }

        function drawMenuButtons() {
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const startY = h / 2;
            const buttonWidth = 300;
            const buttonHeight = 60;
            const buttonSpacing = 80;

            // Continue button (only if game started)
            if (gameStarted) {
                drawButton(centerX - buttonWidth/2, startY, buttonWidth, buttonHeight, 'CONTINUE');
            }

            // New Game button
            drawButton(centerX - buttonWidth/2, startY + (gameStarted ? buttonSpacing : 0), buttonWidth, buttonHeight, 'NEW GAME', true);

            // Settings button
            drawButton(centerX - buttonWidth/2, startY + buttonSpacing * (gameStarted ? 2 : 1), buttonWidth, buttonHeight, 'SETTINGS', true);
        }

        function drawButton(x, y, w, h, text, disabled = false) {
            if (disabled) {
                ctx.fillStyle = '#1a2a3a';
                ctx.globalAlpha = 0.5;
            } else {
                const gradient = ctx.createLinearGradient(x, y, x, y + h);
                gradient.addColorStop(0, '#2a3a4a');
                gradient.addColorStop(1, '#1a2a3a');
                ctx.fillStyle = gradient;
            }
            ctx.fillRect(x, y, w, h);
            ctx.globalAlpha = 1;

            ctx.strokeStyle = disabled ? '#3a3a4a' : '#5a7a8a';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            ctx.fillStyle = disabled ? '#5a5a6a' : '#b0b0b0';
            ctx.font = '24px "Courier New"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x + w/2, y + h/2);
        }

        // ==================== Draw Game World Demo ====================
        function drawGameWorld() {
            const w = canvas.width;
            const h = canvas.height;

            // Simple forest background
            const gradient = ctx.createLinearGradient(0, 0, 0, h);
            gradient.addColorStop(0, '#2a3a2a');
            gradient.addColorStop(1, '#1a2a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);

            // Trees
            for (let i = 0; i < 15; i++) {
                const tx = (i * 137) % w;
                const ty = (i * 73) % (h - 200) + 100;
                drawTree(tx, ty);
            }

            // Path
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(w/2 - 100, 0, 200, h);

            // Player
            drawPlayer();

            // UI text
            ctx.fillStyle = '#fff';
            ctx.font = '24px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('GAME WORLD DEMO - Explore with WASD', w / 2, 50);
            ctx.font = '16px "Courier New"';
            ctx.fillText('(This is a placeholder for the actual game)', w / 2, 80);
        }

        function drawTree(x, y) {
            // Trunk
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(x - 8, y + 20, 16, 40);
            // Leaves
            ctx.fillStyle = '#2a4a2a';
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.fill();
        }

        // ==================== Update Player ====================
        function updatePlayer() {
            const prevX = player.x;
            const prevY = player.y;
            player.isMoving = false;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                player.y -= player.speed;
                player.direction = 'up';
                player.isMoving = true;
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                player.y += player.speed;
                player.direction = 'down';
                player.isMoving = true;
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x -= player.speed;
                player.direction = 'left';
                player.isMoving = true;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += player.speed;
                player.direction = 'right';
                player.isMoving = true;
            }

            // Animation
            if (player.isMoving) {
                player.animTimer++;
                if (player.animTimer > 8) {
                    player.animFrame = (player.animFrame + 1) % 2;
                    player.animTimer = 0;
                }
            } else {
                player.animFrame = 0;
            }

            // Boundaries
            player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));
            player.y = Math.max(player.height/2, Math.min(canvas.height - player.height/2, player.y));

            // Collision detection
            if (currentState === GameState.GRANDPA_CABIN) {
                const playerRect = {
                    x: player.x - player.width/2,
                    y: player.y - player.height/2,
                    width: player.width,
                    height: player.height
                };

                for (const obstacle of collisionRects) {
                    if (checkCollision(playerRect, obstacle)) {
                        player.x = prevX;
                        player.y = prevY;
                        break;
                    }
                }
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function isNearComputer() {
            const dx = player.x - (computer.x + computer.width/2);
            const dy = player.y - (computer.y + computer.height);
            const distance = Math.sqrt(dx * dx + dy * dy);

            // Must be in front of computer (below it)
            const isFacingComputer = player.direction === 'up' && player.y > computer.y + computer.height;

            return distance < computer.interactRadius && isFacingComputer;
        }

        function checkInteraction() {
            if (currentState === GameState.GRANDPA_CABIN && isNearComputer()) {
                // Open encryption-demo.html in new tab
                window.open('encryption-demo.html', '_blank');
            } else if (currentState === GameState.CRYPTOPOLIS_MENU) {
                // Check which button was clicked (simplified - just Continue for now)
                if (gameStarted) {
                    transitionToGameWorld();
                }
            }
        }

        function updateInteractionPrompt() {
            const prompt = document.getElementById('interaction-prompt');
            if (currentState === GameState.GRANDPA_CABIN && isNearComputer()) {
                prompt.style.display = 'block';
            } else {
                prompt.style.display = 'none';
            }
        }

        // ==================== Scene Transitions ====================
        function transitionToCryptopolis() {
            const overlay = document.getElementById('transition-overlay');
            const sceneName = document.getElementById('scene-name');

            overlay.classList.add('active');

            setTimeout(() => {
                currentState = GameState.CRYPTOPOLIS_MENU;
                sceneName.textContent = 'Cryptopolis';
                gameStarted = true;

                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 500);
            }, 1500);
        }

        function transitionToGameWorld() {
            const overlay = document.getElementById('transition-overlay');
            const sceneName = document.getElementById('scene-name');

            overlay.classList.add('active');

            setTimeout(() => {
                currentState = GameState.GAME_WORLD;
                sceneName.textContent = 'Game World';
                player.x = canvas.width / 2;
                player.y = canvas.height / 2;

                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 500);
            }, 1500);
        }

        // Allow clicking Continue button
        canvas.addEventListener('click', (e) => {
            if (currentState === GameState.CRYPTOPOLIS_MENU && gameStarted) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const w = canvas.width;
                const h = canvas.height;
                const buttonX = w / 2 - 150;
                const buttonY = h / 2;
                const buttonW = 300;
                const buttonH = 60;

                if (x >= buttonX && x <= buttonX + buttonW &&
                    y >= buttonY && y <= buttonY + buttonH) {
                    transitionToGameWorld();
                }
            }
        });

        // ==================== Game Loop ====================
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentState === GameState.GRANDPA_CABIN) {
                drawGrandpaCabin();
                updatePlayer();
                drawPlayer();
                updateInteractionPrompt();
            } else if (currentState === GameState.CRYPTOPOLIS_MENU) {
                drawCryptopolisMenu();
            } else if (currentState === GameState.GAME_WORLD) {
                drawGameWorld();
                updatePlayer();
            }

            requestAnimationFrame(gameLoop);
        }

        // ==================== Initialize ====================
        window.addEventListener('resize', () => {
            updateComputerPosition();
            updateCollisionRects();
        });

        // Easter egg: Pressing C goes to Cryptopolis menu (for testing)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') {
                if (currentState === GameState.GRANDPA_CABIN) {
                    transitionToCryptopolis();
                }
            }
        });

        console.log('🎮 Cypherpunk Legacy - Game Started');
        console.log('📝 Use WASD or arrow keys to move');
        console.log('🔑 Press E in front of computer to access encryption demo');
        console.log('🎯 Press C to skip to Cryptopolis menu (testing)');

        gameLoop();
    </script>
</body>
</html>
